syntax = "proto3";

package validationtest;

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/wrappers.proto";

message RecursiveA {
  RecursiveB b = 1;
}

message RecursiveB {
  RecursiveA a = 1;
  int32 v = 2 [(buf.validate.field).int32.gt = 100];
}

message SelfRecursive {
  SelfRecursive next = 1;
  int32 v = 2 [(buf.validate.field).int32.gt = 100];
}

message NoRuleParent {
  NoRuleChild leaf = 1;
  string s = 2;
}

message NoRuleChild {
  int32 v = 1;
}

message Root {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  Node node = 2;
}

message Node {
  Node next = 1;
}

message HasGoogleFields {
  google.protobuf.Struct s = 1;
  google.protobuf.Value v = 2;
  google.protobuf.ListValue l = 3;
}
